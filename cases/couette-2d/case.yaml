id: couette-2d
version: "1.0"
title: 稳态二维 Couette 流
tags: [internal-flow, incompressible, laminar, steady, analytical]

execution:
  - name: serial-1proc
    backend: serial
    processes: 1

  - name: mpi-2proc
    backend: serial
    processes: 2

constants:
  wall_gap:
    type: real
    value: 0.01
    unit: m
  domain_length:
    type: real
    value: 0.1
    unit: m
  domain_depth:
    type: real
    value: 0.001
    unit: m
  kinematic_viscosity:
    type: real
    value: 0.001
    unit: m^2/s
  start_iteration:
    type: integer
    value: 0
  end_iteration:
    type: integer
    value: 200
  iteration_step:
    type: integer
    value: 1
  write_interval:
    type: integer
    value: 20

variables:
  wall_velocity:
    type: real
    required: true
    unit: m/s

derived_variables:
  reynolds_number:
    type: real
    expression: "wall_velocity * wall_gap / kinematic_viscosity"

monitors:
  mean_velocity:
    display_name: 体积加权平均流向速度
    type: real
    unit: m/s
    mapping:
      - solver: OpenFOAM
        name: volAverage(Ux)
  residual_Ux:
    display_name: 每迭代步首个流向速度线性求解初始残差
    type: real
    unit: "1"
    mapping:
      - solver: OpenFOAM
        name: residual:Ux
  residual_p:
    display_name: 每迭代步首个压力线性求解初始残差
    type: real
    unit: "1"
    mapping:
      - solver: OpenFOAM
        name: residual:p

fields:
  velocity:
    display_name: 速度
    type: real
    unit: m/s
    mapping:
      - solver: OpenFOAM
        name: U
  pressure:
    display_name: 运动压力
    type: real
    unit: m^2/s^2
    mapping:
      - solver: OpenFOAM
        name: p
