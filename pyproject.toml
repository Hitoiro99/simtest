[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simtest"
version = "0.1.0"
description = "Reproducible numerical solver testing and analytical comparison"
requires-python = ">=3.8"
dependencies = ["PyYAML>=5.3", "Jinja2>=2.10", "matplotlib>=3.1"]

[project.scripts]
simtest = "simtest:main"

[tool.setuptools]
py-modules = ["simtest", "jobs", "analysis", "archive", "report"]

[tool.setuptools.packages.find]
include = ["case_management*", "common*", "solvers*", "report_assets*"]

[tool.setuptools.package-data]
report_assets = ["*.js", "*.css", "*.html", "*.txt", "*.json"]
